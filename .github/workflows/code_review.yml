name: Code Review with OpenAI
on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
# The action reads the PR through the API and posts a review: nothing more.
permissions:
  contents: read
  pull-requests: write
jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Code Review
        uses: yuri-val/ai-codereviewer@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_MODEL: "gpt-6-luna"
          exclude: "**/*.lock,dist/**,**/*.json, **/*.md"
