name: "Magic Review: OPENAI Code Review Action"
description: "Perform code reviews and comment on diffs using OpenAI API."
inputs:
  GITHUB_TOKEN:
    description: "GitHub token to interact with the repository."
    required: true
  OPENAI_API_KEY:
    description: "OpenAI API key for GPT."
    required: true
  OPENAI_API_MODEL:
    description: "OpenAI API model."
    required: false
    default: "gpt-5.6-luna"
  exclude:
    description: "Glob patterns to exclude files from the diff analysis"
    required: false
    default: ""
  MAX_CONTEXT_TOKENS:
    description: "Context window of the chosen model, in tokens. Set this when the model is newer than the action's built-in table, or to deliberately review fewer files per request."
    required: false
    default: ""
runs:
  using: "node20"
  main: "dist/index.js"
branding:
  icon: "aperture"
  color: "green"
